name: Validate WDL and chromosome mapping
on:
  pull_request:
    paths: ['tensorQTL_trans.wdl', 'tests/**', '.github/workflows/validate.yml']
  push:
    branches: [main]
    paths: ['tensorQTL_trans.wdl', 'tests/**', '.github/workflows/validate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install miniwdl==1.14.2 numpy==1.26.4 pandas==2.2.3 pyarrow==19.0.1
      - run: miniwdl check tensorQTL_trans.wdl
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate with the Cromwell WDL parser
        run: |
          curl --fail --location --retry 3 \
            https://github.com/broadinstitute/cromwell/releases/download/92/womtool-92.jar \
            --output "$RUNNER_TEMP/womtool-92.jar"
          java -jar "$RUNNER_TEMP/womtool-92.jar" validate tensorQTL_trans.wdl
      - run: python -m unittest discover -s tests
      - name: Install CPU smoke dependencies
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 tensorqtl==1.0.10 pgenlib==0.93.0 pandas-plink==2.3.2
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: split-smoke
          create-args: >-
            plink2=2.00a5.12=h4ac6f70_0
            -c conda-forge -c bioconda
      - name: Run real PLINK2 and tensorQTL smoke on CPU
        run: micromamba run -n split-smoke python tests/smoke_tensorqtl.py
